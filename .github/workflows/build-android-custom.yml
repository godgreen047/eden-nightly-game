name: Build Eden Android Custom
run-name: Build Eden Android Custom - ${{ github.ref_name }}

on:
  push:
    branches:
      - eden-game-mode

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrate Eden upstream nightly of October 18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://git.eden-emu.dev/eden-emu/eden.git master
          git merge --no-edit FETCH_HEAD
          git merge-base --is-ancestor de7e6e01d4 HEAD || { echo "Required October 18 Nightly commit not found"; exit 1; }
          git submodule update --init --recursive

      - name: Set build information
        run: |
          EDEN_COMMIT=$(git rev-parse HEAD)
          EDEN_SHORT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "EDEN_COMMIT=$EDEN_COMMIT" >> "$GITHUB_ENV"
          echo "EDEN_SHORT=$EDEN_SHORT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

          echo "================================"
          echo "EDEN BUILD INFORMATION"
          echo "================================"
          echo "Commit: $EDEN_COMMIT"
          echo "Short commit: $EDEN_SHORT"
          echo "Build date: $BUILD_DATE"
          echo "LTO: OFF"
          echo "Nightly: October 18 - de7e6e01d4 integrated"
          echo "================================"

      - name: Create build information file
        run: |
          mkdir -p artifacts

          cat > artifacts/BUILD_INFO.txt <<EOF
          Eden Game Booster - October 18 Nightly

          Integrated upstream commit:
          de7e6e01d4

          Eden upstream/custom commit:
          $EDEN_COMMIT

          Short commit:
          $EDEN_SHORT

          Build date:
          $BUILD_DATE

          LTO:
          OFF

          Game Booster modification:
          ENABLED (existing fork configuration)

          Reverted runtime files:
          NONE

          Branch:
          $GITHUB_REF_NAME

          GitHub workflow run:
          $GITHUB_RUN_NUMBER
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Build Eden Standard No LTO October 18 Nightly
        run: |
          chmod +x .ci/android/build.sh
          ./.ci/android/build.sh -t standard -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-GameBooster-Oct18-Nightly-NoLTO
          path: |
            artifacts/*.apk
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
